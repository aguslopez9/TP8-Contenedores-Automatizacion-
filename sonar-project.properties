# IMPORTANTE: El projectKey debe tener el formato: organization_key-project_key
# Actualiza estos valores con los de tu proyecto en SonarCloud
sonar.projectKey=aguslopez9_TP8-Contenedores-Automatizacion
sonar.projectName=TP8 Contenedores y Automatización
sonar.projectVersion=1.0
sonar.organization=aguslopez9

# IMPORTANTE: El token NO debe estar aquí. Debe estar en GitHub Secrets como SONAR_TOKEN
# Obtén el token en: SonarCloud → My Account → Security → Generate Token
# Luego agrégalo en: GitHub → Settings → Secrets and variables → Actions → SONAR_TOKEN

sonar.sources=backend,frontend
sonar.exclusions=**/node_modules/**,**/test/**,**/tests/**,**/*.test.js,**/*.spec.js,**/coverage/**,**/dist/**,**/build/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.tests=backend/test,frontend/test,cypress/e2e

sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.test.exclusions=**/node_modules/**

sonar.sourceEncoding=UTF-8
sonar.host.url=https://sonarcloud.io
