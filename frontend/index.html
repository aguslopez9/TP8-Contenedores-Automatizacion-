<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Básica</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>To-Do</h1>
      
      <div class="stats-bar" id="stats-bar"></div>
      
      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">Nueva tarea</label>
        <input
          id="todo-input"
          type="text"
          name="todo"
          placeholder="Escribe una tarea..."
          autocomplete="off"
          required
        />
        <select id="priority-select" name="priority" title="Prioridad">
          <option value="low">Baja</option>
          <option value="medium" selected>Media</option>
          <option value="high">Alta</option>
        </select>
        <button type="submit">Agregar</button>
      </form>
      
      <div class="controls">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Todos</button>
          <button class="filter-btn" data-filter="pending">Pendientes</button>
          <button class="filter-btn" data-filter="completed">Completados</button>
        </div>
        <div class="search-box">
          <input
            id="search-input"
            type="text"
            placeholder="Buscar..."
            autocomplete="off"
          />
        </div>
      </div>
      
      <div class="bulk-actions">
        <button id="mark-all-completed" class="bulk-btn">Marcar todos completados</button>
        <button id="delete-completed" class="bulk-btn">Eliminar completados</button>
      </div>
      
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state">No hay tareas todavía.</p>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
