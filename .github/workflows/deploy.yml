name: Deploy

# Este workflow se ejecuta automáticamente cuando:
# 1. El workflow CI completa exitosamente (conclusion == 'success')
# 2. El commit está en la rama main
# 3. Todos los tests unitarios pasaron
#
# Flujo completo:
# PR abierto → CI ejecuta tests → PR aprobado y mergeado → Push a main → 
# CI ejecuta tests y build → Si tests pasan → Deploy a QA → Tests de integración →
# Aprobación manual → Deploy a PROD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  FRONTEND_ARTIFACT: frontend-dist
  BACKEND_ARTIFACT: backend-dist
  BACKEND_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tp8-release-backend

jobs:
  check_quality_gate:
    name: Check SonarCloud Quality Gate
    runs-on: ubuntu-latest
    # Solo se ejecuta si CI completó exitosamente
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq (for JSON parsing)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: aguslopez9_TP8-Contenedores-Automatizacion-
          SONAR_ORGANIZATION: aguslopez9
          MIN_COVERAGE: 70
        run: |
          set -euo pipefail
          echo "🔍 Verificando SonarCloud Quality Gate..."
          echo "Project: ${SONAR_PROJECT_KEY}"
          echo "Organization: ${SONAR_ORGANIZATION}"
          echo "Cobertura mínima requerida: ${MIN_COVERAGE}%"
          echo ""
          
          # 1. Verificar Quality Gate primero
          QUALITY_GATE_URL="https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}"
          echo "📊 Consultando Quality Gate: ${QUALITY_GATE_URL}"
          
          QG_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${QUALITY_GATE_URL}" || echo "ERROR")
          
          if [ "$QG_RESPONSE" = "ERROR" ]; then
            echo "❌ Error al consultar Quality Gate"
            echo "Verifica que SONAR_TOKEN esté configurado correctamente"
            exit 1
          fi
          
          QG_STATUS=$(echo "$QG_RESPONSE" | jq -r '.projectStatus.status' 2>/dev/null || echo "UNKNOWN")
          echo "Quality Gate Status: ${QG_STATUS}"
          
          # Extraer condiciones que fallaron del Quality Gate
          FAILED_CONDITIONS=$(echo "$QG_RESPONSE" | jq -r '.projectStatus.conditions[]? | select(.status == "ERROR") | "  ❌ \(.metricKey): \(.actualValue) (requiere: \(.errorThreshold))"' 2>/dev/null || echo "")
          
          # 2. Verificar métricas adicionales (issues críticos/blocker siempre se verifican)
          METRICS_URL="https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=coverage,critical_violations,blocker_violations"
          echo "📊 Consultando métricas: ${METRICS_URL}"
          
          METRICS_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" "${METRICS_URL}" || echo "ERROR")
          
          COVERAGE=""
          CRITICAL_ISSUES="0"
          BLOCKER_ISSUES="0"
          
          if [ "$METRICS_RESPONSE" != "ERROR" ]; then
            # Extraer métricas
            COVERAGE=$(echo "$METRICS_RESPONSE" | jq -r '.component.measures[]? | select(.metric == "coverage") | .value' 2>/dev/null || echo "")
            CRITICAL_ISSUES=$(echo "$METRICS_RESPONSE" | jq -r '.component.measures[]? | select(.metric == "critical_violations") | .value' 2>/dev/null || echo "0")
            BLOCKER_ISSUES=$(echo "$METRICS_RESPONSE" | jq -r '.component.measures[]? | select(.metric == "blocker_violations") | .value' 2>/dev/null || echo "0")
            
            echo ""
            echo "📈 Métricas obtenidas:"
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "" ]; then
              echo "  - Cobertura: ${COVERAGE}%"
            else
              echo "  - Cobertura: No disponible"
            fi
            echo "  - Issues críticos: ${CRITICAL_ISSUES}"
            echo "  - Issues blocker: ${BLOCKER_ISSUES}"
            echo ""
          else
            echo "⚠️ No se pudo obtener métricas, usando solo Quality Gate"
          fi
          
          # 3. Verificar issues críticos/blocker (siempre se verifican independientemente del Quality Gate)
          BLOCKED_BY_ISSUES=false
          if [ -n "$CRITICAL_ISSUES" ] && [ "$CRITICAL_ISSUES" != "0" ] && [ "$CRITICAL_ISSUES" != "null" ]; then
            echo "❌ ISSUES CRÍTICOS DETECTADOS: ${CRITICAL_ISSUES}"
            BLOCKED_BY_ISSUES=true
          fi
          
          if [ -n "$BLOCKER_ISSUES" ] && [ "$BLOCKER_ISSUES" != "0" ] && [ "$BLOCKER_ISSUES" != "null" ]; then
            echo "❌ ISSUES BLOCKER DETECTADOS: ${BLOCKER_ISSUES}"
            BLOCKED_BY_ISSUES=true
          fi
          
          # 4. Verificar Quality Gate y aplicar lógica de decisión
          echo ""
          echo "📊 Quality Gate Response:"
          echo "$QG_RESPONSE" | jq '.' 2>/dev/null || echo "$QG_RESPONSE"
          echo ""
          
          # Decisión final basada en Quality Gate status
          if [ "$QG_STATUS" = "OK" ]; then
            # Quality Gate pasó - verificar issues críticos/blocker adicionalmente
            if [ "$BLOCKED_BY_ISSUES" = "true" ]; then
              echo ""
              echo "❌ Quality Gate: PASSED pero hay issues críticos/blocker"
              echo "🚫 El deploy está BLOQUEADO por issues críticos o blocker"
              echo ""
              echo "📋 Acciones requeridas:"
              echo "  1. Revisa el reporte en SonarCloud:"
              echo "     https://sonarcloud.io/project/overview?id=${SONAR_PROJECT_KEY}"
              echo "  2. Resuelve los issues críticos/blocker"
              echo "  3. Haz un nuevo push para re-evaluar"
              exit 1
            fi
            
            # Si Quality Gate está OK y no hay issues críticos/blocker, verificar cobertura como advertencia
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "" ] && [ "$COVERAGE" != "null" ]; then
              COVERAGE_NUM=$(echo "$COVERAGE" | sed 's/[^0-9.]//g' || echo "0")
              if [ -n "$COVERAGE_NUM" ] && [ "$COVERAGE_NUM" != "" ] && [ "$COVERAGE_NUM" != "0" ]; then
                COVERAGE_CHECK=$(awk "BEGIN {if ($COVERAGE_NUM < $MIN_COVERAGE) print \"FAIL\"; else print \"PASS\"}" 2>/dev/null || echo "PASS")
                if [ "$COVERAGE_CHECK" = "FAIL" ]; then
                  echo "⚠️ ADVERTENCIA: Cobertura ${COVERAGE}% es menor que ${MIN_COVERAGE}%"
                  echo "El Quality Gate está OK, pero se recomienda aumentar la cobertura"
                  echo ""
                else
                  echo "✅ Cobertura verificada: ${COVERAGE}% >= ${MIN_COVERAGE}%"
                fi
              fi
            fi
            
            echo ""
            echo "✅ Quality Gate: PASSED"
            echo "✅ Sin issues críticos o blocker"
            echo "✅ Listo para deploy"
            exit 0
            
          elif [ "$QG_STATUS" = "ERROR" ]; then
            echo ""
            echo "❌ Quality Gate: FAILED"
            echo ""
            
            if [ -n "$FAILED_CONDITIONS" ]; then
              echo "❌ Condiciones del Quality Gate que fallaron:"
              echo "$FAILED_CONDITIONS"
              echo ""
            fi
            
            # Verificar cobertura si está disponible
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "" ] && [ "$COVERAGE" != "null" ]; then
              COVERAGE_NUM=$(echo "$COVERAGE" | sed 's/[^0-9.]//g' || echo "0")
              if [ -n "$COVERAGE_NUM" ] && [ "$COVERAGE_NUM" != "" ]; then
                COVERAGE_CHECK=$(awk "BEGIN {if ($COVERAGE_NUM < $MIN_COVERAGE) print \"FAIL\"; else print \"PASS\"}" 2>/dev/null || echo "PASS")
                if [ "$COVERAGE_CHECK" = "FAIL" ]; then
                  echo "❌ COBERTURA INSUFICIENTE: ${COVERAGE}% < ${MIN_COVERAGE}%"
                  echo ""
                fi
              fi
            fi
            
            if [ "$BLOCKED_BY_ISSUES" = "true" ]; then
              echo "❌ Hay issues críticos o blocker sin resolver"
              echo ""
            fi
            
            echo "🚫 El deploy está BLOQUEADO porque el Quality Gate falló"
            echo ""
            echo "📋 Acciones requeridas:"
            echo "  1. Revisa el reporte en SonarCloud:"
            echo "     https://sonarcloud.io/project/overview?id=${SONAR_PROJECT_KEY}"
            echo "  2. Corrige los problemas reportados"
            echo "  3. Haz un nuevo push para re-evaluar"
            exit 1
            
          else
            echo ""
            echo "⚠️ Quality Gate Status: ${QG_STATUS}"
            echo "No se pudo determinar el estado completo. Verifica manualmente en SonarCloud."
            echo "URL: https://sonarcloud.io/project/overview?id=${SONAR_PROJECT_KEY}"
            
            # Si no podemos verificar el Quality Gate, aplicar verificaciones estrictas
            if [ "$BLOCKED_BY_ISSUES" = "true" ]; then
              echo "❌ Hay issues críticos o blocker detectados"
              exit 1
            fi
            
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "" ] && [ "$COVERAGE" != "null" ]; then
              COVERAGE_NUM=$(echo "$COVERAGE" | sed 's/[^0-9.]//g' || echo "0")
              if [ -n "$COVERAGE_NUM" ] && [ "$COVERAGE_NUM" != "" ] && [ "$COVERAGE_NUM" != "0" ]; then
                COVERAGE_CHECK=$(awk "BEGIN {if ($COVERAGE_NUM < $MIN_COVERAGE) print \"FAIL\"; else print \"PASS\"}" 2>/dev/null || echo "PASS")
                if [ "$COVERAGE_CHECK" = "FAIL" ]; then
                  echo "❌ COBERTURA INSUFICIENTE: ${COVERAGE}% < ${MIN_COVERAGE}%"
                  exit 1
                fi
              fi
            fi
            
            # Si no podemos verificar, bloquear por seguridad
            exit 1
          fi

  deploy_qa:
    name: Deploy QA
    # Solo se ejecuta si:
    # 1. El CI completó exitosamente (todos los tests pasaron)
    # 2. El commit está en la rama main (PR mergeado)
    # 3. El Quality Gate pasó (nuevo requisito)
    # Esto asegura que solo código validado se despliega
    needs: check_quality_gate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: qa
    env:
      SOURCE_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Limpiar código fuente local
        run: |
          rm -rf frontend
          rm -rf backend

      - name: Download frontend artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: CI
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend

      - name: Download backend artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: CI
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ env.BACKEND_ARTIFACT }}
          path: backend

      - name: Inject QA config
        run: |
          cat <<'EOF' > frontend/config.js
          window.__APP_CONFIG = {
            apiBaseUrl: "${{ vars.QA_BACKEND_URL }}"
          };
          EOF

      - name: Deploy frontend to QA
        run: bash scripts/deploy_frontend.sh qa
        env:
          FRONTEND_TOKEN: ${{ secrets.QA_FRONTEND_TOKEN }}
          FRONTEND_SITE_ID: ${{ vars.QA_FRONTEND_SITE_ID }}
          FRONTEND_DEPLOY_ENDPOINT: ${{ vars.QA_FRONTEND_DEPLOY_ENDPOINT }}

      - name: Adjuntar zip del frontend QA
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-zip
          path: frontend.zip
          retention-days: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote backend image to qa tag
        run: |
          if [ -z "$SOURCE_IMAGE_TAG" ]; then
            echo "Missing SOURCE_IMAGE_TAG"; exit 1;
          fi
          IMAGE="${BACKEND_IMAGE_REPO}"
          docker pull "${IMAGE}:${SOURCE_IMAGE_TAG}"
          docker tag "${IMAGE}:${SOURCE_IMAGE_TAG}" "${IMAGE}:qa"
          docker push "${IMAGE}:qa"

      - name: Trigger container deploy in Render (QA)
        run: bash scripts/deploy_backend_container.sh
        env:
          RENDER_API_KEY: ${{ secrets.QA_BACKEND_TOKEN }}
          RENDER_SERVICE_ID: ${{ vars.QA_BACKEND_SERVICE_ID }}
          CONTAINER_IMAGE: ${{ env.BACKEND_IMAGE_REPO }}:qa
          RENDER_REGION: ${{ vars.QA_RENDER_REGION }}

      - name: QA health check
        env:
          QA_BACKEND_URL: ${{ vars.QA_BACKEND_URL }}
          QA_HEALTHCHECK_URL: ${{ vars.QA_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          URL="${QA_HEALTHCHECK_URL}"
          if [ -z "$URL" ]; then
            if [ -z "$QA_BACKEND_URL" ]; then
              echo "QA_BACKEND_URL no definido: no puedo construir la URL del health check."
              exit 1
            fi
            URL="${QA_BACKEND_URL%/}/health"
          fi
          echo "Verificando health check en $URL"
          bash scripts/health_check.sh "$URL"

      - name: Run integration tests
        env:
          QA_BACKEND_URL: ${{ vars.QA_BACKEND_URL }}
        # IMPORTANTE: set -euo pipefail asegura que si cualquier test falla,
        # el pipeline se detiene y no continúa con el deploy a PROD
        run: |
          set -euo pipefail
          echo "Running integration tests against QA environment: ${QA_BACKEND_URL}"
          
          # Test 1: Health endpoint
          echo "Test 1: Health endpoint"
          curl -f "${QA_BACKEND_URL%/}/health" || exit 1
          
          # Test 2: Create todo
          echo "Test 2: Create todo"
          TODO_RESPONSE=$(curl -s -X POST "${QA_BACKEND_URL%/}/todos" \
            -H "Content-Type: application/json" \
            -d '{"text":"Integration test todo","priority":"high"}')
          TODO_ID=$(echo "$TODO_RESPONSE" | grep -o '"id":[0-9]*' | grep -o '[0-9]*' | head -1)
          if [ -z "$TODO_ID" ]; then
            echo "Failed to create todo"
            exit 1
          fi
          
          # Test 3: Get todos
          echo "Test 3: Get todos"
          curl -f "${QA_BACKEND_URL%/}/todos" || exit 1
          
          # Test 4: Update todo
          echo "Test 4: Update todo"
          curl -f -X PATCH "${QA_BACKEND_URL%/}/todos/${TODO_ID}" \
            -H "Content-Type: application/json" \
            -d '{"completed":true}' || exit 1
          
          # Test 5: Get stats
          echo "Test 5: Get stats"
          curl -f "${QA_BACKEND_URL%/}/todos/stats" || exit 1
          
          # Test 6: Filter by priority
          echo "Test 6: Filter by priority"
          curl -f "${QA_BACKEND_URL%/}/todos?priority=high" || exit 1
          
          # Test 7: Delete todo
          echo "Test 7: Delete todo"
          curl -f -X DELETE "${QA_BACKEND_URL%/}/todos/${TODO_ID}" || exit 1
          
          echo "✅ All integration tests passed"
          echo ""
          echo "✅ Quality Gate: Tests de integración - PASSED"

      - name: Display integration test results
        if: always()
        run: |
          echo "## 🧪 Integration Tests Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Integration tests executed against QA environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend URL**: \`${QA_BACKEND_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests Executed:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Health endpoint check" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Create todo (POST /todos)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Get todos (GET /todos)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Update todo (PATCH /todos/:id)" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Get statistics (GET /todos/stats)" >> $GITHUB_STEP_SUMMARY
          echo "6. ✅ Filter by priority (GET /todos?priority=high)" >> $GITHUB_STEP_SUMMARY
          echo "7. ✅ Delete todo (DELETE /todos/:id)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Integration Tests**: 7" >> $GITHUB_STEP_SUMMARY

  deploy_prod:
    name: Deploy Prod
    # Solo se ejecuta si:
    # 1. CI completó exitosamente
    # 2. Quality Gate pasó (needs: check_quality_gate)
    # 3. Deploy a QA completó exitosamente (needs: deploy_qa)
    # 4. Tests de integración pasaron (incluido en deploy_qa)
    needs: [check_quality_gate, deploy_qa]
    runs-on: ubuntu-latest
    environment: prod
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.deploy_qa.result == 'success' &&
      needs.check_quality_gate.result == 'success'
    env:
      SOURCE_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Limpiar código fuente local
        run: |
          rm -rf frontend
          rm -rf backend

      - name: Download frontend artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: CI
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend

      - name: Download backend artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: CI
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ env.BACKEND_ARTIFACT }}
          path: backend

      - name: Inject PROD config
        run: |
          cat <<'EOF' > frontend/config.js
          window.__APP_CONFIG = {
            apiBaseUrl: "${{ vars.PROD_BACKEND_URL }}"
          };
          EOF

      - name: Deploy frontend to Prod
        run: bash scripts/deploy_frontend.sh prod
        env:
          FRONTEND_TOKEN: ${{ secrets.PROD_FRONTEND_TOKEN }}
          FRONTEND_SITE_ID: ${{ vars.PROD_FRONTEND_SITE_ID }}
          FRONTEND_DEPLOY_ENDPOINT: ${{ vars.PROD_FRONTEND_DEPLOY_ENDPOINT }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote backend image to prod tag
        run: |
          if [ -z "$SOURCE_IMAGE_TAG" ]; then
            echo "Missing SOURCE_IMAGE_TAG"; exit 1;
          fi
          IMAGE="${BACKEND_IMAGE_REPO}"
          docker pull "${IMAGE}:${SOURCE_IMAGE_TAG}"
          docker tag "${IMAGE}:${SOURCE_IMAGE_TAG}" "${IMAGE}:prod"
          docker push "${IMAGE}:prod"

      - name: Trigger container deploy in Render (Prod)
        run: bash scripts/deploy_backend_container.sh
        env:
          RENDER_API_KEY: ${{ secrets.PROD_BACKEND_TOKEN }}
          RENDER_SERVICE_ID: ${{ vars.PROD_BACKEND_SERVICE_ID }}
          CONTAINER_IMAGE: ${{ env.BACKEND_IMAGE_REPO }}:prod
          RENDER_REGION: ${{ vars.PROD_RENDER_REGION }}

      - name: Prod health check
        env:
          PROD_BACKEND_URL: ${{ vars.PROD_BACKEND_URL }}
          PROD_HEALTHCHECK_URL: ${{ vars.PROD_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          URL="${PROD_HEALTHCHECK_URL}"
          if [ -z "$URL" ]; then
            if [ -z "$PROD_BACKEND_URL" ]; then
              echo "PROD_BACKEND_URL no definido: no puedo construir la URL del health check."
              exit 1
            fi
            URL="${PROD_BACKEND_URL%/}/health"
          fi
          echo "Verificando health check en $URL"
          bash scripts/health_check.sh "$URL"

