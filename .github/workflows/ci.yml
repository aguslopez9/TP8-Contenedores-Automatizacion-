name: CI

on:
  push:
    branches:
      - main
      - TP8
  pull_request:
    branches:
      - main

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend sources
        run: 
          node --check app.js
          node --check config.js

      - name: Run unit tests
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Display test results in summary
        if: always()
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend

  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start server for tests
        run: |
          PORT=3001 npm start &
          sleep 3
        continue-on-error: false

      - name: Run unit tests
        id: test
        run: |
          set -o pipefail
          export TEST_PORT=3001
          npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Stop server
        if: always()
        run: |
          pkill -f "node server.js" || true

      - name: Display test results in summary
        if: always()
        run: |
          echo "## Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend

  publish_backend_image:
    name: Package backend image
    runs-on: ubuntu-latest
    needs: build_backend
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tp8-release-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test_e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python (for frontend server)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cypress
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          PORT=3001 npm start &
          sleep 5
        env:
          TEST_PORT: 3001

      - name: Start frontend server
        working-directory: frontend
        run: |
          python3 -m http.server 8080 &
          sleep 3

      - name: Wait for servers to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:3001/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -f http://localhost:8080; do sleep 1; done'

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
          TEST_PORT: 3001
        run: npm run test:e2e
        continue-on-error: false

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore


      - name: Stop servers
        if: always()
        run: |
          pkill -f "node server.js" || true
          pkill -f "python3 -m http.server" || true

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install coverage tools
        run: npm install -g c8

      - name: Generate backend coverage
        working-directory: backend
        run: |
          mkdir -p coverage
          
          PORT=3001 c8 --reporter=lcov --reporter=text --reporter=html \
            --include='server.js' --include='storage.js' \
            --exclude='test/**' --exclude='node_modules/**' \
            --exclude='data/**' \
            --temp-directory=coverage/tmp \
            --reports-dir=coverage \
            node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          
          sleep 6
          
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            cat /tmp/server.log || true
            exit 1
          fi
          
          for i in {1..5}; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              break
            fi
            if [ $i -eq 5 ]; then
              cat /tmp/server.log
              kill -9 $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          
          export TEST_PORT=3001
          npm test || true
          
          kill -TERM $SERVER_PID 2>/dev/null || true
          
          MAX_WAIT=20
          for i in $(seq 1 $MAX_WAIT); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              break
            fi
            if [ $i -eq $MAX_WAIT ]; then
              kill -9 $SERVER_PID 2>/dev/null || true
              break
            fi
            sleep 1
          done
          
          sleep 5
          
          if kill -0 $SERVER_PID 2>/dev/null; then
            kill -9 $SERVER_PID 2>/dev/null || true
            sleep 3
          fi
          
          if [ -d coverage/tmp ]; then
            V8_FILE_COUNT=$(find coverage/tmp -name "*.json" 2>/dev/null | wc -l)
            
            if [ "$V8_FILE_COUNT" -gt 0 ]; then
              c8 report --reporter=lcov --reporter=text \
                --include='server.js' --include='storage.js' \
                --exclude='test/**' --exclude='node_modules/**' \
                --exclude='data/**' \
                --temp-directory=coverage/tmp \
                --reports-dir=coverage 2>&1 || {
                ABS_TMP_DIR="$(pwd)/coverage/tmp"
                ABS_REPORTS_DIR="$(pwd)/coverage"
                c8 report --reporter=lcov \
                  --include='server.js' --include='storage.js' \
                  --temp-directory="$ABS_TMP_DIR" \
                  --reports-dir="$ABS_REPORTS_DIR" 2>&1 || true
              }
              
              sleep 3
            fi
          fi
          
          if [ -f coverage/lcov.info ] && [ -s coverage/lcov.info ]; then
            LINES=$(wc -l < coverage/lcov.info)
            SOURCE_FILES=$(grep -c "^SF:" coverage/lcov.info || echo "0")
            
            if [ "$LINES" -gt 10 ] && [ "$SOURCE_FILES" -gt 0 ]; then
              sed -i.bak 's|^SF:backend/|SF:backend/|g; s|^SF:.*/backend/|SF:backend/|g' coverage/lcov.info || true
              rm -f coverage/lcov.info.bak
            else
              echo "ERROR: Backend coverage report is invalid"
              exit 1
            fi
          else
            echo "ERROR: Coverage report not found or is empty"
            exit 1
          fi

      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          
          BACKEND_COVERAGE_EXISTS=false
          FRONTEND_COVERAGE_EXISTS=false
          
          if [ -f backend/coverage/lcov.info ] && [ -s backend/coverage/lcov.info ]; then
            BACKEND_LINES=$(wc -l < backend/coverage/lcov.info)
            BACKEND_SOURCE_FILES=$(grep -c "^SF:" backend/coverage/lcov.info || echo "0")
            
            if [ "$BACKEND_LINES" -gt 10 ] && [ "$BACKEND_SOURCE_FILES" -gt 0 ]; then
              sed 's|^SF:.*/backend/|SF:backend/|g; s|^SF:backend/|SF:backend/|g' backend/coverage/lcov.info > /tmp/backend-coverage-normalized.lcov
              
              if [ ! -f coverage/lcov.info ]; then
                cp /tmp/backend-coverage-normalized.lcov coverage/lcov.info
              else
                grep -v "^TN:" /tmp/backend-coverage-normalized.lcov >> coverage/lcov.info || cat /tmp/backend-coverage-normalized.lcov >> coverage/lcov.info
              fi
              BACKEND_COVERAGE_EXISTS=true
            fi
          fi
          
          if [ -f frontend/coverage/lcov.info ] && [ -s frontend/coverage/lcov.info ]; then
            FRONTEND_LINES=$(wc -l < frontend/coverage/lcov.info)
            FRONTEND_SOURCE_FILES=$(grep -c "^SF:" frontend/coverage/lcov.info || echo "0")
            
            if [ "$FRONTEND_LINES" -gt 10 ] && [ "$FRONTEND_SOURCE_FILES" -gt 0 ]; then
              sed 's|^SF:.*/frontend/|SF:frontend/|g; s|^SF:frontend/|SF:frontend/|g' frontend/coverage/lcov.info > /tmp/frontend-coverage-normalized.lcov
              
              if [ ! -f coverage/lcov.info ]; then
                cp /tmp/frontend-coverage-normalized.lcov coverage/lcov.info
              else
                grep -v "^TN:" /tmp/frontend-coverage-normalized.lcov >> coverage/lcov.info || cat /tmp/frontend-coverage-normalized.lcov >> coverage/lcov.info
              fi
              FRONTEND_COVERAGE_EXISTS=true
            fi
          fi
          
          if [ -f coverage/lcov.info ]; then
            FINAL_LINES=$(wc -l < coverage/lcov.info)
            FINAL_SOURCE_FILES=$(grep -c "^SF:" coverage/lcov.info || echo "0")
            
            if [ "$FINAL_LINES" -gt 10 ] && [ "$FINAL_SOURCE_FILES" -gt 0 ]; then
              echo "Coverage report merged successfully"
            else
              echo "ERROR: Coverage report is invalid"
              exit 1
            fi
          else
            echo "ERROR: No coverage report was created"
            exit 1
          fi

      - name: Publish coverage results
        run: |
          if [ -f coverage/lcov.info ]; then
            SOURCE_FILES=$(grep -c "^SF:" coverage/lcov.info || echo "0")
            
            if [ "$SOURCE_FILES" -eq 0 ]; then
              echo "ERROR: No source files found in coverage report"
              exit 1
            fi
            
            HAS_BACKEND_SERVER=$(grep -c "^SF:backend/server.js" coverage/lcov.info || echo "0")
            HAS_BACKEND_STORAGE=$(grep -c "^SF:backend/storage.js" coverage/lcov.info || echo "0")
            
            if [ "$HAS_BACKEND_SERVER" -eq 0 ] || [ "$HAS_BACKEND_STORAGE" -eq 0 ]; then
              echo "ERROR: Missing backend files in coverage report"
              exit 1
            fi
          else
            echo "ERROR: Coverage report not found"
            exit 1
          fi

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
