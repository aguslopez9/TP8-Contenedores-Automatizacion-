name: CI

# Este workflow se ejecuta en:
# 1. Push a main o TP8: Ejecuta build, tests y publica imagen Docker
# 2. Pull Request a main: Ejecuta build y tests (sin publicar imagen)
# 
# IMPORTANTE: El deploy solo se ejecuta cuando:
# - Un PR es aprobado y mergeado a main (trigger: push a main)
# - Todos los tests unitarios pasan exitosamente
# - El workflow Deploy se ejecuta automáticamente después de CI exitoso
on:
  push:
    branches:
      - main
      - TP8
  pull_request:
    branches:
      - main

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend sources
        run: 
          node --check app.js
          node --check config.js

      - name: Run unit tests
        id: test
        # IMPORTANTE: continue-on-error: false asegura que si los tests fallan,
        # el pipeline se detiene inmediatamente y no continúa con el deploy
        run: npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Display test results in summary
        if: always()
        run: |
          echo "## 📊 Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract test count from Jest output
          TEST_COUNT=$(grep -oP "Tests:\s+\K[0-9]+" test-output.txt | head -1 || echo "0")
          if [ -n "$TEST_COUNT" ] && [ "$TEST_COUNT" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Total Tests**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for failures
          if grep -qi "failed\|FAIL" test-output.txt; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend

  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start server for tests
        run: |
          PORT=3001 npm start &
          sleep 3
          echo "Server started in background"
        continue-on-error: false

      - name: Run unit tests
        id: test
        # IMPORTANTE: continue-on-error: false asegura que si los tests fallan,
        # el pipeline se detiene inmediatamente y no continúa con el deploy
        run: |
          export TEST_PORT=3001
          npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Stop server
        if: always()
        run: |
          pkill -f "node server.js" || true

      - name: Display test results in summary
        if: always()
        run: |
          echo "## 📊 Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract test count
          TEST_COUNT=$(grep -o "✔" test-output.txt | wc -l | tr -d ' ')
          if [ -n "$TEST_COUNT" ] && [ "$TEST_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Total Tests Passed**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for failures
          if grep -q "✖\|FAIL\|Error" test-output.txt; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend

  publish_backend_image:
    name: Package backend image
    runs-on: ubuntu-latest
    needs: build_backend
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tp8-release-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test_e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python (for frontend server)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cypress
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          PORT=3001 npm start &
          sleep 5
          echo "Backend server started"
        env:
          TEST_PORT: 3001

      - name: Start frontend server
        working-directory: frontend
        run: |
          python3 -m http.server 8080 &
          sleep 3
          echo "Frontend server started"

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for servers..."
          timeout 30 bash -c 'until curl -f http://localhost:3001/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -f http://localhost:8080; do sleep 1; done'
          echo "Servers are ready"

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
          TEST_PORT: 3001
        run: npm run test:e2e
        continue-on-error: false

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Display E2E test results
        if: always()
        run: |
          echo "## 🎭 E2E Test Results (Cypress)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d cypress/videos ]; then
            echo "✅ E2E tests completed" >> $GITHUB_STEP_SUMMARY
            echo "View videos and screenshots in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ E2E test results not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop servers
        if: always()
        run: |
          pkill -f "node server.js" || true
          pkill -f "python3 -m http.server" || true

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install coverage tools
        run: |
          npm install -g c8
          echo "✅ Coverage tools installed"

      - name: Generate backend coverage
        working-directory: backend
        run: |
          echo "🔍 Generando cobertura del backend..."
          mkdir -p coverage
          
          # Estrategia mejorada: Usar c8 directamente para ejecutar el servidor
          # c8 capturará la cobertura cuando el proceso termine
          echo "📊 Iniciando servidor con c8 coverage tracking..."
          
          # Ejecutar servidor con c8 en background
          PORT=3001 c8 --reporter=lcov --reporter=text --reporter=html \
            --include='server.js' --include='storage.js' \
            --exclude='test/**' --exclude='node_modules/**' \
            node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          
          echo "⏳ Esperando que el servidor inicie (PID: $SERVER_PID)..."
          sleep 6
          
          # Verificar que el servidor está corriendo
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Error: El servidor no está corriendo"
            echo "📋 Server log:"
            cat /tmp/server.log || echo "No log available"
            exit 1
          fi
          
          echo "✅ Servidor iniciado correctamente"
          echo "🧪 Ejecutando tests..."
          export TEST_PORT=3001
          node --test test/*.test.js || echo "Tests completed"
          
          echo "🛑 Deteniendo servidor de forma segura para que c8 escriba el reporte..."
          # Enviar SIGTERM (permite que c8 escriba el reporte)
          kill -TERM $SERVER_PID 2>/dev/null || true
          
          # Esperar a que el proceso termine (c8 necesita tiempo para escribir)
          for i in {1..10}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "✅ Servidor terminado correctamente"
              break
            fi
            echo "⏳ Esperando que el servidor termine... ($i/10)"
            sleep 1
          done
          
          # Si aún está corriendo después de 10 segundos, forzar terminación
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "⚠️ Servidor aún corriendo, forzando terminación..."
            kill -9 $SERVER_PID 2>/dev/null || true
            sleep 2
          fi
          
          # Verificar que el reporte se generó
          if [ -f coverage/lcov.info ]; then
            LINES=$(wc -l < coverage/lcov.info)
            echo "✅ Backend coverage report generated (${LINES} lines)"
            echo "📋 First 30 lines of coverage report:"
            head -30 coverage/lcov.info || echo "Could not read coverage file"
            
            # Verificar que el reporte tiene contenido real
            SOURCE_FILES=$(grep -c "^SF:" coverage/lcov.info || echo "0")
            if [ "$SOURCE_FILES" -gt 0 ]; then
              echo "✅ Reporte contiene ${SOURCE_FILES} archivos fuente"
            else
              echo "⚠️ WARNING: Reporte generado pero no contiene archivos fuente"
            fi
          else
            echo "❌ ERROR: Coverage report not found at coverage/lcov.info"
            echo "📁 Contents of coverage directory:"
            ls -la coverage/ || echo "Coverage directory not found"
            echo "📋 Server log:"
            cat /tmp/server.log || echo "No log available"
            echo "⚠️ Continuando sin cobertura del backend..."
          fi

      - name: Generate frontend coverage
        working-directory: frontend
        run: |
          echo "🔍 Generando cobertura del frontend..."
          npm run test:coverage
          
          # Verificar que el reporte se generó
          if [ -f coverage/lcov.info ]; then
            echo "✅ Frontend coverage report generated"
            echo "📊 Coverage file size: $(wc -l < coverage/lcov.info) lines"
            echo "📋 First 20 lines of coverage report:"
            head -20 coverage/lcov.info || echo "Could not read coverage file"
          else
            echo "⚠️ Warning: Frontend coverage report not found"
            echo "📁 Contents of coverage directory:"
            ls -la coverage/ || echo "Coverage directory not found"
          fi

      - name: Merge coverage reports
        run: |
          echo "🔍 Combinando reportes de cobertura (siguiendo guía de referencia)..."
          mkdir -p coverage
          
          # Según la guía, los reportes LCOV deben estar en coverage/lcov.info
          # Combinamos los reportes del backend y frontend
          
          BACKEND_COVERAGE_EXISTS=false
          FRONTEND_COVERAGE_EXISTS=false
          
          # Agregar cobertura del backend si existe
          if [ -f backend/coverage/lcov.info ]; then
            BACKEND_LINES=$(wc -l < backend/coverage/lcov.info)
            BACKEND_SOURCE_FILES=$(grep -c "^SF:" backend/coverage/lcov.info || echo "0")
            
            if [ "$BACKEND_LINES" -gt 10 ] && [ "$BACKEND_SOURCE_FILES" -gt 0 ]; then
              echo "📊 Adding backend coverage (${BACKEND_LINES} lines, ${BACKEND_SOURCE_FILES} source files)..."
              # Si el archivo final no existe, copiar el del backend
              if [ ! -f coverage/lcov.info ]; then
                cp backend/coverage/lcov.info coverage/lcov.info
              else
                # Combinar: agregar el contenido del backend (sin el header TN: si ya existe)
                grep -v "^TN:" backend/coverage/lcov.info >> coverage/lcov.info || cat backend/coverage/lcov.info >> coverage/lcov.info
              fi
              BACKEND_COVERAGE_EXISTS=true
            else
              echo "⚠️ Backend coverage file exists but seems invalid (${BACKEND_LINES} lines, ${BACKEND_SOURCE_FILES} source files)"
            fi
          else
            echo "⚠️ Backend coverage file not found at backend/coverage/lcov.info"
          fi
          
          # Agregar cobertura del frontend si existe
          if [ -f frontend/coverage/lcov.info ]; then
            FRONTEND_LINES=$(wc -l < frontend/coverage/lcov.info)
            FRONTEND_SOURCE_FILES=$(grep -c "^SF:" frontend/coverage/lcov.info || echo "0")
            
            if [ "$FRONTEND_LINES" -gt 10 ] && [ "$FRONTEND_SOURCE_FILES" -gt 0 ]; then
              echo "📊 Adding frontend coverage (${FRONTEND_LINES} lines, ${FRONTEND_SOURCE_FILES} source files)..."
              # Combinar: agregar el contenido del frontend (sin el header TN: si ya existe)
              if [ ! -f coverage/lcov.info ]; then
                cp frontend/coverage/lcov.info coverage/lcov.info
              else
                grep -v "^TN:" frontend/coverage/lcov.info >> coverage/lcov.info || cat frontend/coverage/lcov.info >> coverage/lcov.info
              fi
              FRONTEND_COVERAGE_EXISTS=true
            else
              echo "⚠️ Frontend coverage file exists but seems invalid (${FRONTEND_LINES} lines, ${FRONTEND_SOURCE_FILES} source files)"
            fi
          else
            echo "⚠️ Frontend coverage file not found at frontend/coverage/lcov.info"
          fi
          
          # Verificar que el archivo final tenga contenido válido
          if [ -f coverage/lcov.info ]; then
            FINAL_LINES=$(wc -l < coverage/lcov.info)
            FINAL_SOURCE_FILES=$(grep -c "^SF:" coverage/lcov.info || echo "0")
            
            if [ "$FINAL_LINES" -gt 10 ] && [ "$FINAL_SOURCE_FILES" -gt 0 ]; then
              echo "✅ Coverage report merged successfully"
              echo "📈 Coverage summary:"
              echo "  - Total lines: ${FINAL_LINES}"
              echo "  - Source files: ${FINAL_SOURCE_FILES}"
              echo "  - Backend: $([ "$BACKEND_COVERAGE_EXISTS" = true ] && echo "✅ Included" || echo "❌ Missing")"
              echo "  - Frontend: $([ "$FRONTEND_COVERAGE_EXISTS" = true ] && echo "✅ Included" || echo "❌ Missing")"
              echo ""
              echo "📋 Sample coverage data (first 5 source files):"
              grep "^SF:" coverage/lcov.info | head -5 || echo "No source files found"
              echo ""
              echo "📊 Coverage statistics:"
              grep -E "^LF:|^LH:" coverage/lcov.info | head -10 || echo "No coverage statistics found"
            else
              echo "❌ ERROR: Coverage report is invalid (${FINAL_LINES} lines, ${FINAL_SOURCE_FILES} source files)"
              echo "📁 Checking for coverage files:"
              find . -name "lcov.info" -type f -exec sh -c 'echo "  - {} ($(wc -l < {} | tr -d " ") lines, $(grep -c "^SF:" {} || echo 0) source files)"' \; 2>/dev/null || echo "No lcov.info files found"
              exit 1
            fi
          else
            echo "❌ ERROR: No coverage report was created"
            echo "📁 Checking for coverage files:"
            find . -name "lcov.info" -type f 2>/dev/null | head -10 || echo "No lcov.info files found"
            exit 1
          fi

      - name: Publish coverage results (siguiendo guía de referencia)
        # Similar a PublishCodeCoverageResults@2 en Azure DevOps
        # En GitHub Actions, publicamos el reporte como artifact y verificamos que esté correcto
        run: |
          echo "📤 Publicando resultados de code coverage (siguiendo guía)..."
          if [ -f coverage/lcov.info ]; then
            LINES=$(wc -l < coverage/lcov.info)
            SIZE=$(du -h coverage/lcov.info | cut -f1)
            SOURCE_FILES=$(grep -c "^SF:" coverage/lcov.info || echo "0")
            
            echo "✅ Reporte de cobertura listo para SonarCloud:"
            echo "  - Ubicación: coverage/lcov.info"
            echo "  - Tamaño: ${SIZE} (${LINES} líneas)"
            echo "  - Archivos fuente: ${SOURCE_FILES}"
            
            if [ "$SOURCE_FILES" -eq 0 ]; then
              echo "❌ ERROR: No se encontraron archivos fuente en el reporte LCOV"
              echo "📋 Primeras 50 líneas del reporte:"
              head -50 coverage/lcov.info
              echo ""
              echo "❌ El reporte no es válido. SonarCloud no podrá leer la cobertura."
              exit 1
            else
              echo "✅ Reporte válido con ${SOURCE_FILES} archivos fuente"
              echo "📋 Lista de archivos fuente en el reporte:"
              grep "^SF:" coverage/lcov.info | head -10
              echo ""
              echo "✅ El reporte está listo para ser analizado por SonarCloud"
            fi
          else
            echo "❌ ERROR: Reporte de cobertura no encontrado en coverage/lcov.info"
            echo "📁 Buscando archivos lcov.info en el proyecto:"
            find . -name "lcov.info" -type f 2>/dev/null || echo "No se encontraron archivos lcov.info"
            exit 1
          fi
          
          # Publicar como artifact para referencia
          echo "📦 Publicando reporte como artifact..."
          mkdir -p coverage-artifact
          cp coverage/lcov.info coverage-artifact/ || exit 1

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

      - name: SonarCloud Scan
        # Según la guía, SonarCloud debe leer el reporte de coverage/lcov.info
        # que está configurado en sonar-project.properties
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          # SonarCloud leerá automáticamente coverage/lcov.info según sonar-project.properties
