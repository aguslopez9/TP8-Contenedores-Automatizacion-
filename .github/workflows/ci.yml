name: CI

# Este workflow se ejecuta en:
# 1. Push a main o TP8: Ejecuta build, tests y publica imagen Docker
# 2. Pull Request a main: Ejecuta build y tests (sin publicar imagen)
# 
# IMPORTANTE: El deploy solo se ejecuta cuando:
# - Un PR es aprobado y mergeado a main (trigger: push a main)
# - Todos los tests unitarios pasan exitosamente
# - El workflow Deploy se ejecuta automáticamente después de CI exitoso
on:
  push:
    branches:
      - main
      - TP8
  pull_request:
    branches:
      - main

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend sources
        run: 
          node --check app.js
          node --check config.js

      - name: Run unit tests
        id: test
        # IMPORTANTE: continue-on-error: false asegura que si los tests fallan,
        # el pipeline se detiene inmediatamente y no continúa con el deploy
        run: npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Display test results in summary
        if: always()
        run: |
          echo "## 📊 Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract test count from Jest output
          TEST_COUNT=$(grep -oP "Tests:\s+\K[0-9]+" test-output.txt | head -1 || echo "0")
          if [ -n "$TEST_COUNT" ] && [ "$TEST_COUNT" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Total Tests**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for failures
          if grep -qi "failed\|FAIL" test-output.txt; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend

  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start server for tests
        run: |
          PORT=3001 npm start &
          sleep 3
          echo "Server started in background"
        continue-on-error: false

      - name: Run unit tests
        id: test
        # IMPORTANTE: continue-on-error: false asegura que si los tests fallan,
        # el pipeline se detiene inmediatamente y no continúa con el deploy
        run: |
          export TEST_PORT=3001
          npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Stop server
        if: always()
        run: |
          pkill -f "node server.js" || true

      - name: Display test results in summary
        if: always()
        run: |
          echo "## 📊 Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract test count
          TEST_COUNT=$(grep -o "✔" test-output.txt | wc -l | tr -d ' ')
          if [ -n "$TEST_COUNT" ] && [ "$TEST_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Total Tests Passed**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for failures
          if grep -q "✖\|FAIL\|Error" test-output.txt; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend

  publish_backend_image:
    name: Package backend image
    runs-on: ubuntu-latest
    needs: build_backend
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tp8-release-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test_e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python (for frontend server)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
          TEST_PORT: 3001
        run: npm run test:e2e
        continue-on-error: false

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload E2E test results XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/e2e-results.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Display E2E test results
        if: always()
        run: |
          echo "## 🎭 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/e2e-results.xml ]; then
            echo "✅ E2E tests completed" >> $GITHUB_STEP_SUMMARY
            echo "View detailed report in artifacts: playwright-report" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ E2E test results not found" >> $GITHUB_STEP_SUMMARY
          fi

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Prepare coverage directory
        run: |
          mkdir -p coverage
          # Usar el reporte de frontend como base (backend usa test runner nativo sin LCOV directo)
          if [ -f frontend/coverage/lcov.info ]; then
            cp frontend/coverage/lcov.info coverage/lcov.info
            echo "✅ Coverage report generated"
          else
            echo "⚠️ Coverage report not found, creating empty one"
            echo "TN:" > coverage/lcov.info
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
