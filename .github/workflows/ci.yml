name: CI

# Este workflow se ejecuta en:
# 1. Push a main o TP8: Ejecuta build, tests y publica imagen Docker
# 2. Pull Request a main: Ejecuta build y tests (sin publicar imagen)
# 
# IMPORTANTE: El deploy solo se ejecuta cuando:
# - Un PR es aprobado y mergeado a main (trigger: push a main)
# - Todos los tests unitarios pasan exitosamente
# - El workflow Deploy se ejecuta automáticamente después de CI exitoso
on:
  push:
    branches:
      - main
      - TP8
  pull_request:
    branches:
      - main

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend sources
        run: 
          node --check app.js
          node --check config.js

      - name: Run unit tests
        id: test
        # IMPORTANTE: continue-on-error: false asegura que si los tests fallan,
        # el pipeline se detiene inmediatamente y no continúa con el deploy
        run: npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Display test results in summary
        if: always()
        run: |
          echo "## 📊 Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract test count from Jest output
          TEST_COUNT=$(grep -oP "Tests:\s+\K[0-9]+" test-output.txt | head -1 || echo "0")
          if [ -n "$TEST_COUNT" ] && [ "$TEST_COUNT" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Total Tests**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for failures
          if grep -qi "failed\|FAIL" test-output.txt; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend

  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start server for tests
        run: |
          PORT=3001 npm start &
          sleep 3
          echo "Server started in background"
        continue-on-error: false

      - name: Run unit tests
        id: test
        # IMPORTANTE: continue-on-error: false asegura que si los tests fallan,
        # el pipeline se detiene inmediatamente y no continúa con el deploy
        run: |
          export TEST_PORT=3001
          npm test 2>&1 | tee test-output.txt
        continue-on-error: false

      - name: Stop server
        if: always()
        run: |
          pkill -f "node server.js" || true

      - name: Display test results in summary
        if: always()
        run: |
          echo "## 📊 Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract test count
          TEST_COUNT=$(grep -o "✔" test-output.txt | wc -l | tr -d ' ')
          if [ -n "$TEST_COUNT" ] && [ "$TEST_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Total Tests Passed**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for failures
          if grep -q "✖\|FAIL\|Error" test-output.txt; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend

  publish_backend_image:
    name: Package backend image
    runs-on: ubuntu-latest
    needs: build_backend
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tp8-release-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test_e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python (for frontend server)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cypress
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          PORT=3001 npm start &
          sleep 5
          echo "Backend server started"
        env:
          TEST_PORT: 3001

      - name: Start frontend server
        working-directory: frontend
        run: |
          python3 -m http.server 8080 &
          sleep 3
          echo "Frontend server started"

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for servers..."
          timeout 30 bash -c 'until curl -f http://localhost:3001/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -f http://localhost:8080; do sleep 1; done'
          echo "Servers are ready"

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
          TEST_PORT: 3001
        run: npm run test:e2e
        continue-on-error: false

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Display E2E test results
        if: always()
        run: |
          echo "## 🎭 E2E Test Results (Cypress)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d cypress/videos ]; then
            echo "✅ E2E tests completed" >> $GITHUB_STEP_SUMMARY
            echo "View videos and screenshots in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ E2E test results not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop servers
        if: always()
        run: |
          pkill -f "node server.js" || true
          pkill -f "python3 -m http.server" || true

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install coverage tools
        run: |
          npm install -g c8
          echo "✅ Coverage tools installed"

      - name: Generate backend coverage
        working-directory: backend
        run: |
          # Start server with c8 coverage tracking
          PORT=3001 c8 --reporter=lcov --reporter=text --reporter=html --include='server.js' --include='storage.js' node server.js &
          SERVER_PID=$!
          sleep 5
          export TEST_PORT=3001
          # Run tests (they will hit the server and trigger code execution)
          node --test test/*.test.js || echo "Tests completed"
          # Stop server
          kill $SERVER_PID 2>/dev/null || pkill -f "node server.js" || true
          sleep 2
          echo "✅ Backend coverage generated"

      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          echo "TN:" > coverage/lcov.info
          
          # Agregar cobertura del backend si existe
          if [ -f backend/coverage/lcov.info ]; then
            echo "📊 Adding backend coverage..."
            cat backend/coverage/lcov.info >> coverage/lcov.info
          fi
          
          # Agregar cobertura del frontend si existe
          if [ -f frontend/coverage/lcov.info ]; then
            echo "📊 Adding frontend coverage..."
            cat frontend/coverage/lcov.info >> coverage/lcov.info
          fi
          
          # Verificar que el archivo no esté vacío
          if [ -s coverage/lcov.info ]; then
            echo "✅ Coverage report merged successfully"
            echo "📈 Coverage summary:"
            grep -E "^SF:|^LF:|^LH:" coverage/lcov.info | head -10 || echo "Coverage data found"
          else
            echo "⚠️ Coverage report is empty, creating minimal report"
            echo "TN:" > coverage/lcov.info
            echo "SF:backend/server.js" >> coverage/lcov.info
            echo "SF:frontend/app.js" >> coverage/lcov.info
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
